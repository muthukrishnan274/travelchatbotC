<
    --error: #c0392b;!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ chatbot_title }}</title>
<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --primary: #7a4d2b;
    --primary-dark: #5f3a1f;
    --text: #262220;
    --muted: #756a63;
    --user-bubble: #7a4d2b;
    --assistant-bubble: #f0ebe4;
    --border: #e6ddd2;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    padding: 16px 20px;
    background: var(--primary);
    color: white;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  header h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
  }
  header p {
    margin: 0;
    font-size: 0.8rem;
    opacity: 0.9;
  }
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    max-width: 320px;
  }
  .empty-state h2 {
    font-size: 1rem;
    color: var(--text);
    margin-bottom: 6px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 0.94rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: center;
    background: #fdecea;
    color: var(--error);
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--assistant-bubble);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }
  .input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #message-input {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
  }
  #message-input:focus {
    border-color: var(--primary);
  }
  #send-btn {
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 0.95rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }
  #send-btn:hover:not(:disabled) {
    background: var(--primary-dark);
  }
  @media (max-width: 480px) {
    .app { max-width: 100%; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>{{ chatbot_title }}</h1>
    <p>{{ chatbot_purpose }}</p>
  </header>

  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">
      <h2>{{ chatbot_title }}</h2>
      <p>Ask a question to get started.</p>
    </div>
  </div>

  <div class="input-bar">
    <textarea
      id="message-input"
      rows="1"
      placeholder="Type your message..."
      aria-label="Message"
    ></textarea>
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const chatArea = document.getElementById('chat-area');
  const emptyState = document.getElementById('empty-state');
  const input = document.getElementById('message-input');
  const sendBtn = document.getElementById('send-btn');

  // Conversation history is kept in memory on the client and sent with
  // every request; the backend itself is stateless.
  let history = [];
  let isSending = false;

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  }
  input.addEventListener('input', autoResize);

  function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function appendMessage(role, text) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatArea.appendChild(div);
    scrollToBottom();
    return div;
  }

  function appendError(text) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg error';
    div.textContent = text;
    chatArea.appendChild(div);
    scrollToBottom();
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatArea.appendChild(div);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || isSending) return;

    isSending = true;
    sendBtn.disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    input.value = '';
    autoResize();
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history })
      });

      hideTyping();

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        appendError(data.error || 'Something went wrong. Please try again.');
        isSending = false;
        sendBtn.disabled = false;
        return;
      }

      const reply = data.reply || 'Sorry, I could not generate a response.';
      appendMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      hideTyping();
      appendError('Network error. Please check your connection and try again.');
    } finally {
      isSending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
    // Shift+Enter falls through and inserts a newline naturally.
  });

  input.focus();
</script>
</body>
</html>
